    <!--
      The home hero's plate is the largest thing the page paints, and it is
      discovered only once the bundle has run, so it is preloaded here instead.

      The descriptors are the same set the <picture> offers, so the browser
      picks one rung and the element then finds it already in cache. AVIF only:
      the `type` makes anything without AVIF support skip the hint rather than
      fetch a file it cannot use, and those browsers fall through to the WebP
      <source> as usual. Kept in step with PLATE_SIZES in HomeHero.jsx.

      index.html is served for every route, so the guard keeps the hint on the
      one page that actually shows the plate.
    -->
    <script>
      (function () {
        if (location.pathname.replace(/\/+$/, "") !== "") return;

        var base = "/media/foto/vozni-park-pozadi-zalazak";
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = "image/avif";
        link.imageSrcset = [480, 960, 1440, 1800]
          .map(function (width) {
            return base + "-" + width + ".avif " + width + "w";
          })
          .join(", ");
        link.imageSizes =
          "(max-width: 900px) calc(100vw - 40px), (max-width: 1440px) 44vw, 620px";
        link.fetchPriority = "high";
        document.head.appendChild(link);
      })();
    </script>
